[package]
name = "opendeck-akp05"
version = "0.14.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0"

[dependencies]
data-url = "0.3.2"
dirs = "7"
env_logger = "0.11.11"
futures-lite = "2.6.1"
image = { version = "0.25.10", default-features = false, features = [
  "bmp",
  "png",
  "jpeg",
] }
log = "0.4.34"
mirajazz = "0.16.3"
openaction = "2.8.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["full"] }
toml = "1.1.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Memory",
] }
async-hid = "0.5.3"
libloading = "0.8"
notify = { version = "8", default-features = false }
turbojpeg = { version = "1.5.1", default-features = false, features = [
  "cmake",
  "require-simd",
] }
